name: Generate ASCII portrait
on:
  workflow_dispatch:
    inputs:
      options:
        description: Extra options for profilecard ascii
        required: false
        default: "--auto"
permissions:
  contents: write
jobs:
  ascii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-ascii.txt
      - run: curl -fsSL "https://avatars.githubusercontent.com/u/332807167?v=4&s=460" -o avatar.png
      - run: python -m profilecard ascii avatar.png ${{ inputs.options }} > ascii.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ascii.txt
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore: generate ASCII portrait"
          git push
